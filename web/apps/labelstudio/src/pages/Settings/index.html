<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Labelstudio</title>
  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
</head>

<body>
  <div id="root"></div>
  <script>
    function aa() { 
      const heartbeatUrl = `${window.location.protocol}//${window.location.hostname}:6001/api/user_heartbeat`;
      fetch(heartbeatUrl, { method: 'POST' });}
    aa()
    setInterval(() => {
      aa()
    }, 300);
  </script>
</body>

</html>
